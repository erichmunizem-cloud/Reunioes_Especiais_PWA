<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A192F"><title>Leitor interno</title><style>:root{--navy:#0A192F;--card:#112240;--gold:#D4AF37;--cream:#FDFBF7;--muted:#A8B2D1;--line:rgba(212,175,55,.28)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--navy);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:auto 1fr}.bar{min-height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 12px;background:#08182b}.bar button,.bar a{background:transparent;border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:9px 11px;text-decoration:none;cursor:pointer}.bar .back{color:var(--gold)}.title{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Georgia,serif}.viewer{min-height:0;display:grid;place-items:stretch;background:#0b1626}.viewer iframe,.viewer object{border:0;width:100%;height:100%;background:#fff}.media{display:grid;place-items:center;padding:24px}.media audio,.media video{width:min(100%,1000px);max-height:82vh}.fallback{text-align:center;color:var(--muted);padding:30px}.fallback a{color:var(--gold)}@media(max-width:600px){.bar{min-height:56px}.title{font-size:13px}.bar .secondary{display:inline-flex;padding:8px 9px;font-size:12px}}</style></head><body><header class="bar"><button class="back" onclick="history.back()">← Voltar</button><div class="title" id="title">Leitor interno</div><a class="secondary home-link" href="index.html#inicio">⌂ Início</a><a id="open" class="secondary" target="_blank">Abrir arquivo</a></header><main class="viewer" id="viewer"></main><script>(function(){
const p=new URLSearchParams(location.search),file=p.get('file'),title=p.get('title')||'Leitor interno';document.getElementById('title').textContent=title;const v=document.getElementById('viewer'),open=document.getElementById('open');
function safeHref(path){if(/^[a-z][a-z0-9+.-]*:/i.test(path))return path;return path.split('/').map((part,i)=>i===0&&part===''?'':encodeURIComponent(part)).join('/')}function goBack(){if(history.length>1)history.back();else location.href='index.html'}document.querySelector('.back').onclick=goBack;
if(!file){v.innerHTML='<div class="fallback">Arquivo não informado.</div>';return}const href=safeHref(file),ext=(file.split('.').pop()||'').toLowerCase();open.href=href;open.textContent=ext==='pdf'?'Abrir PDF':'Abrir arquivo';
if(ext==='pdf'){const o=document.createElement('iframe');o.src=href+'#view=FitH';o.title=title;o.loading='eager';v.appendChild(o)}else if(['mp3','m4a','aac','wav','ogg'].includes(ext)){v.classList.add('media');const x=document.createElement('audio');x.controls=true;x.preload='metadata';x.src=href;v.appendChild(x)}else if(['mp4','m4v','webm','mov'].includes(ext)){v.classList.add('media');const x=document.createElement('video');x.controls=true;x.preload='metadata';x.playsInline=true;x.src=href;v.appendChild(x)}else if(ext==='html'||ext==='htm'){const x=document.createElement('iframe');x.src=href;x.title=title;v.appendChild(x)}else{v.innerHTML='<div class="fallback">Este formato não possui visualização integrada.<br><br><a href="'+href+'">Abrir arquivo</a></div>'}})();</script></body></html>
